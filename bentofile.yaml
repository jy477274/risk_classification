service: "serve_bento_gb.py:TrustSafetyRiskService"
labels:
  owner: trust-safety-ml
  stage: production
models:
  - "trust_safety_champion:latest"
  - "trust_safety_challenger:latest"
include:
  - "serve_bento_gb.py"
exclude:
  - "data/"
  - "mlruns/"
  - "mlflow.db"
  - ".venv/"
python:
  packages:
    - "lightgbm"
    - "scikit-learn>=1.6.0"
    - "pandas"
    - "pydantic>=2.0.0"
    - "growthbook"
    - "prometheus-client"
docker:
  distro: debian
  python_version: "3.12"
  system_packages:
    - libgomp1