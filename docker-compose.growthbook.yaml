services:
  mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - gb_mongo_data:/data/db

  growthbook:
    image: growthbook/growthbook:latest
    ports:
      - "3000:3000"
      - "3100:3100"
    environment:
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
      - MONGODB_USERNAME=root
      - MONGODB_PASSWORD=password
      - MONGODB_DBNAME=growthbook
      - JWT_SECRET=devsecret_change_in_prod
      - ENCRYPTION_KEY=devsecret_encryption_key_32_chars_
      - API_HOST=http://localhost:3100
      - APP_ORIGIN=http://localhost:3000
    depends_on:
      - mongo

volumes:
  gb_mongo_data: